<!DOCTYPE html>
<html lang="en">
<head>

    <title>IFAC 2026 · Poster resources</title>

    <style>
        :root { color-scheme: light; --blue: #1a598e; --ink: #23364a; --muted: #596c7c; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 32px 16px; background: #f0f4f8; color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
        main { width: 100%; max-width: 576px; margin: 0 auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 12px 40px #17355012; }
        header { padding: 36px 28px; background: var(--blue); color: white; text-align: center; }
        h1 { margin: 0 0 12px; font-size: clamp(1.65rem, 5vw, 2rem); line-height: 1.2; letter-spacing: -.025em; }
        header p { margin: 0; color: #e1edf7; font-size: 1rem; }
        .content { padding: 28px; }
        nav { display: grid; gap: 14px; }
        a { color: var(--blue); }
        a:focus-visible { outline: 3px solid #d68100; outline-offset: 5px; }
        .button { display: flex; gap: 12px; align-items: center; justify-content: center; min-height: 56px; padding: 13px 18px; border: 2px solid var(--blue); border-radius: 12px; font-size: 1rem; font-weight: 650; line-height: 1.4; text-align: center; text-decoration: none; }
        .button svg { width: 22px; height: 22px; flex-shrink: 0; }
        .primary { color: white; background: var(--blue); }
        .primary:hover { background: #124571; border-color: #124571; }
        .secondary:hover { background: #eef5fa; }
        .certificate { margin-top: 32px; padding-top: 24px; border-top: 1px solid #e1e8ef; }
        h2 { margin: 0 0 16px; font-size: 1.15rem; font-weight: 650; }
        .preview { display: block; border: 1px solid #dce4eb; border-radius: 8px; overflow: hidden; background: #f7f8fa; }
        .preview img { display: block; width: 100%; height: auto; }
        .pdf-link { margin-top: 16px; }
        .hint { margin: 10px 0 0; color: var(--muted); text-align: center; font-size: .875rem; }
        footer { padding: 20px 24px; border-top: 1px solid #e1e8ef; background: #f8fafc; color: var(--muted); text-align: center; font-size: .8rem; }
        footer p { margin: 0; }
        @media (max-width: 380px) { body { padding: 16px 12px; } header { padding: 28px 20px; } .content { padding: 22px 18px; } .button { padding-inline: 12px; } }
    </style>
</head>
